spring.application.name=testpsicologici
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.lifecycle.timeout-per-shutdown-phase=10s

app.data-directory=${RAILWAY_VOLUME_MOUNT_PATH:./data}
app.site-url=${APP_SITE_URL:}
spring.datasource.url=${APP_DATABASE_URL:jdbc:h2:file:${app.data-directory}/testpsicologici;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${APP_DATABASE_USERNAME:sa}
spring.datasource.password=${APP_DATABASE_PASSWORD:}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.analytics.time-zone=Europe/Rome
app.analytics.cookie-secret=${VISITOR_COOKIE_SECRET:}
app.monitoring.username=${MONITORING_USERNAME:}
app.monitoring.password=${MONITORING_PASSWORD:}
app.privacy-contact-email=${APP_PRIVACY_CONTACT_EMAIL:}

# Stripe Checkout remains disabled unless explicitly enabled. Secrets must only
# be supplied through environment variables and must never be committed.
app.payments.stripe.enabled=${STRIPE_PAYMENTS_ENABLED:false}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
