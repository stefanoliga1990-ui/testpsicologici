<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${test.title} · Spazio Test|">Test · Spazio Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="intro-body">
<main class="intro-shell">
    <nav class="site-nav" aria-label="Navigazione principale">
        <a class="brand" th:href="@{/}"><span class="brand-mark">✦</span> Spazio Test</a>
        <a class="back-link" th:href="@{/}">← Tutti i test</a>
    </nav>
    <section class="intro-card">
        <p class="eyebrow" th:text="${test.eyebrow}">Autovalutazione informativa</p>
        <h1 th:text="${test.title}">Tratti autistici nell'adulto</h1>
        <p class="intro-description" th:text="${test.description}">Un esercizio di auto-osservazione.</p>
        <div class="intro-facts"><span th:text="${test.duration}">6 min · 24 domande</span><span>Nessun account richiesto</span></div>
        <div class="notice-box">
            <span aria-hidden="true">i</span>
            <p><strong>Prima di iniziare</strong><span th:text="${test.introductoryText}">Questo questionario è informativo e non costituisce una diagnosi psicologica.</span></p>
        </div>
        <form method="post" th:action="@{/test/{id}/inizia(id=${test.id})}">
            <button class="button button-primary" type="submit">Inizia il questionario <span aria-hidden="true">→</span></button>
        </form>
    </section>
</main>
</body>
</html>
