<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Accesso al monitoraggio | Spazio Test</title>
    <th:block th:replace="~{fragments/brand-head :: icons}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v='social-1')}">
</head>
<body class="monitoring-login-body">
<main class="monitoring-login-card">
    <a class="brand" th:href="@{/}"><img class="brand-mark" th:src="@{/images/brand/logo-mark.svg}" alt="" width="27" height="27"> Spazio Test</a>
    <div><p class="eyebrow">Area riservata</p><h1>Monitoraggio visite</h1><p>Inserisci le credenziali configurate per accedere ai dati aggregati.</p></div>
    <p class="monitoring-login-message error" th:if="${param.error}">Credenziali non valide.</p>
    <p class="monitoring-login-message" th:if="${param.logout}">Sessione terminata correttamente.</p>
    <form th:action="@{/monitoring/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Nome utente</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">Accedi</button>
    </form>
    <a class="monitoring-back" th:href="@{/}">← Torna al sito</a>
</main>
</body>
</html>
