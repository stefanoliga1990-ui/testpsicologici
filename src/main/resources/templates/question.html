<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow, noarchive">
    <title th:text="|Domanda ${questionNumber} di ${questionCount} · ${test.title} · Spazio Test|">Domanda · Spazio Test</title>
    <th:block th:replace="~{fragments/brand-head :: icons}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v='mobile-nav-1')}">
    <link rel="stylesheet" th:href="@{/react/assets/app.css(v='react-4')}">
</head>
<body class="test-body">
<th:block th:replace="~{fragments/react-root :: mount(${reactPageData})}"></th:block>
<main class="test-shell">
    <th:block th:replace="~{fragments/site-header :: siteHeader}"></th:block>

    <section class="question-layout">
        <div class="question-meta">
            <span th:text="|Domanda ${questionNumber} di ${questionCount}|">Domanda 1 di 24</span>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" th:attr="aria-valuenow=${progress}">
                <div class="progress-value" th:style="|width:${progress}%|"></div>
            </div>
        </div>
        <p class="question-prompt" th:text="${test.responseInstruction}">Pensando al periodo indicato, con quale frequenza ti è capitato?</p>
        <h1 th:text="${question.text}">Quando apro una nuova pagina, mi piace che tutto sia chiaro al primo sguardo.</h1>
        <p class="question-example" th:if="${question.example != null and !question.example.isBlank()}">
            <strong>Un esempio possibile:</strong> <span th:text="${question.example}">una situazione equivalente e concreta.</span>
        </p>

        <form class="answer-form" method="post" th:action="@{/test/{id}/domanda/{number}(id=${test.id},number=${questionNumber})}">
            <div class="answer-navigation">
                <a class="answer-nav" th:if="${questionNumber > 1}" th:href="@{/test/{id}/domanda/{number}(id=${test.id},number=${questionNumber - 1})}" aria-label="Torna alla domanda precedente">
                    <span aria-hidden="true">&larr;</span>
                </a>
                <span class="answer-nav answer-nav-disabled" th:unless="${questionNumber > 1}" aria-hidden="true">
                    <span>&larr;</span>
                </span>
            <fieldset>
                <legend class="sr-only">Scegli una risposta</legend>
                <label class="answer-option" th:each="answer, iter : ${answers}">
                    <input type="radio" name="answer" th:value="${iter.count}" th:checked="${selectedAnswer == iter.count}" required>
                    <span class="custom-radio" aria-hidden="true"></span>
                    <span th:text="${answer}">Mai</span>
                </label>
            </fieldset>
            <button class="answer-nav answer-nav-next" type="submit" th:aria-label="${questionNumber == questionCount ? 'Mostra il risultato' : 'Vai alla domanda successiva'}">
                <span th:text="${questionNumber == questionCount ? 'Scopri il risultato' : 'Continua'}">Continua</span>
                <span aria-hidden="true">→</span>
            </button>
            </div>
        </form>
    </section>
    <div th:replace="~{fragments/site-footer :: siteFooter}"></div>
</main>
</body>
</html>
