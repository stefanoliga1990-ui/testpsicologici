<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Monitoraggio visite | Spazio Test</title>
    <th:block th:replace="~{fragments/brand-head :: icons}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v='test-completions-1')}">
    <link rel="stylesheet" th:href="@{/react/assets/app.css(v='react-5')}">
</head>
<body class="monitoring-body">
<th:block th:replace="~{fragments/react-root :: mount(${reactPageData})}"></th:block>
<main class="monitoring-shell" data-react-fallback>
    <header class="monitoring-nav">
        <a class="brand" th:href="@{/}"><img class="brand-mark" th:src="@{/images/brand/logo-mark.svg}" alt="" width="27" height="27"> Spazio Test</a>
        <div class="monitoring-actions"><th:block th:replace="~{fragments/social-link :: instagramLink}"></th:block><form th:action="@{/monitoring/logout}" method="post"><button type="submit">Esci</button></form></div>
    </header>
    <section class="monitoring-heading">
        <div><p class="eyebrow">Accesso riservato</p><h1>Monitoraggio visite</h1></div>
        <p>Dati aggregati giornalieri</p>
    </section>
    <section class="monitoring-summary">
        <article class="monitoring-today"><p>Visitatori distinti oggi</p><strong th:text="${snapshot.todayVisitors}">0</strong><span th:text="${snapshot.today}">2026-08-21</span></article>
    </section>
    <section class="monitoring-tests-panel">
        <div class="monitoring-panel-heading"><div><p class="eyebrow">Questionari conclusi</p><h2>Completamenti per test</h2></div></div>
        <div class="monitoring-test-list">
            <button type="button" th:each="completion : ${testCompletions}">
                <span class="monitoring-test-name" th:text="${completion.testTitle}">Nome test</span>
                <span class="monitoring-test-counts"><span><strong th:text="${completion.todayCompletions}">0</strong> oggi</span><span><strong th:text="${completion.totalCompletions}">0</strong> totali</span></span>
                <span class="monitoring-test-chevron" aria-hidden="true">+</span>
            </button>
        </div>
    </section>
</main>
</body>
</html>
